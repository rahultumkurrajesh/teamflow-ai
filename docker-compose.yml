# Local development stack. Frontend, Nginx, and the background worker join in
# later stages. db and redis intentionally do NOT expose ports to the host;
# the backend reaches them over Docker's internal network. Only the backend
# port 8000 is published so the browser can reach the API.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: teamflow
      POSTGRES_PASSWORD: teamflow
      POSTGRES_DB: teamflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
      - ./backend/minio-init.sh:/docker-entrypoint-initdb.d/init-bucket.sh
    entrypoint: sh
    command: -c 'minio server /data --console-address ":9001" & sh /docker-entrypoint-initdb.d/init-bucket.sh'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
